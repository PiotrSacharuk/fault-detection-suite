name: Test Suite

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        fault-mode: [fixed, buggy, all]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          set -o pipefail
          pytest --fault-mode=${{ matrix.fault-mode }} | tee pytest_output.log

      - name: Publish Fault Detection Report to Job Summary
        if: always() && matrix.fault-mode == 'all' && matrix.python-version == '3.12'
        run: |
          echo "## Fault Detection Report — Mode: \`${{ matrix.fault-mode }}\` | Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"

          sed -n '/REPORT_START/,/REPORT_END/p' pytest_output.log \
            | grep -v -E '^(REPORT_START|REPORT_END)$' \
            >> "$GITHUB_STEP_SUMMARY" || echo "No fault detection report found in output." >> "$GITHUB_STEP_SUMMARY"

          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Link report in PR
        if: >
          always() &&
          github.event_name == 'pull_request' &&
          matrix.fault-mode == 'all' &&
          matrix.python-version == '3.12'
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `**Fault Detection Report:** [open GitHub Actions summary](${url})`
            });
